<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>trocami.</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#f6f7f9;color:#1c1f26}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #e3e5ea;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{background:#e8590c;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:15px;cursor:pointer}
button.ghost{background:#eceef2;color:#1c1f26}
main{max-width:720px;margin:0 auto;padding:16px}
input,textarea,select{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #cfd3da;border-radius:8px;font-size:16px;font-family:inherit}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card img{width:100%;max-height:260px;object-fit:cover;border-radius:8px}
.grid{display:grid;gap:12px}
.muted{color:#6b7280;font-size:14px}
.tag{display:inline-block;background:#fff1e6;color:#b34700;border-radius:6px;padding:2px 8px;font-size:13px;margin-right:6px}
.msg{padding:8px;border-radius:8px;background:#f1f3f6;margin:6px 0}
.err{color:#c92a2a}
</style>
</head>
<body>
<header>
  <h1 onclick="go('list')">trocami.</h1>
  <nav id="nav"></nav>
</header>
<main id="app"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== À REMPLIR (Supabase > Project Settings > API) ======
const SUPABASE_URL = "https://sxjmrzzvuvsdodvcvyah.supabase.co";
const SUPABASE_KEY = "sb_publishable_t0P-fgXerTGncd8BFFZJhg_adTJjvAG";
// ===========================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const T = {
  fr: {
    all:"Objets", add:"Proposer", inbox:"Messages", login:"Connexion", logout:"Sortir",
    search:"Rechercher un objet…", none:"Aucun objet pour le moment.",
    title:"Titre", desc:"Description", wanted:"Je cherche en échange", price:"Prix en argent, FCFA (optionnel)",
    photo:"Photo", publish:"Publier", email:"Email", pass:"Mot de passe", name:"Ton prénom",
    signin:"Se connecter", signup:"Créer un compte", by:"Par", exchange:"Échange contre",
    orMoney:"ou en argent", contact:"Contacter", yourMsg:"Ton message", send:"Envoyer",
    sent:"Message envoyé", rate:"Noter ce membre", stars:"Étoiles (1 à 5)", comment:"Commentaire",
    rated:"Merci pour ta note", noRate:"Aucune note", reply:"Répondre", noMsg:"Aucun message.",
    need:"Connecte-toi d'abord.", del:"Supprimer", confirmed:"Compte créé. Vérifie ton email si on te le demande, puis connecte-toi.",
    mine:"Ton objet", fill:"Remplis le titre."
  },
  en: {
    all:"Items", add:"Offer", inbox:"Messages", login:"Log in", logout:"Log out",
    search:"Search an item…", none:"No items yet.",
    title:"Title", desc:"Description", wanted:"Looking for in exchange", price:"Price in money, FCFA (optional)",
    photo:"Photo", publish:"Publish", email:"Email", pass:"Password", name:"Your first name",
    signin:"Log in", signup:"Sign up", by:"By", exchange:"Swap for",
    orMoney:"or in money", contact:"Contact", yourMsg:"Your message", send:"Send",
    sent:"Message sent", rate:"Rate this member", stars:"Stars (1 to 5)", comment:"Comment",
    rated:"Thanks for your rating", noRate:"No rating", reply:"Reply", noMsg:"No messages.",
    need:"Please log in first.", del:"Delete", confirmed:"Account created. Check your email if asked, then log in.",
    mine:"Your item", fill:"Fill in the title."
  }
};
let lang = localStorage.getItem("lang") || "fr";
let user = null;
const t = k => T[lang][k] || k;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const app = $("app");

function nav() {
  $("nav").innerHTML =
    `<button class="ghost" onclick="go('list')">${t("all")}</button>` +
    `<button onclick="go('new')">${t("add")}</button>` +
    (user ? `<button class="ghost" onclick="go('inbox')">${t("inbox")}</button>
             <button class="ghost" onclick="logout()">${t("logout")}</button>`
          : `<button class="ghost" onclick="go('login')">${t("login")}</button>`) +
    `<button class="ghost" onclick="toggleLang()">${lang === "fr" ? "EN" : "FR"}</button>`;
}
function toggleLang() {
  lang = lang === "fr" ? "en" : "fr";
  localStorage.setItem("lang", lang);
  document.documentElement.lang = lang;
  go(current.view, current.arg);
}

let current = { view: "list", arg: null };
function go(view, arg) {
  current = { view, arg };
  nav();
  ({ list: viewList, new: viewNew, item: viewItem, inbox: viewInbox, login: viewLogin })[view](arg);
  window.scrollTo(0, 0);
}

async function viewList(q = "") {
  app.innerHTML = `<input id="q" placeholder="${t("search")}" value="${esc(q)}"><div id="items" class="grid"></div>`;
  $("q").oninput = e => loadItems(e.target.value);
  loadItems(q);
}
async function loadItems(q) {
  let req = db.from("items").select("*").order("created_at", { ascending: false }).limit(60);
  if (q) req = req.ilike("title", `%${q.replace(/[%,]/g, "")}%`);
  const { data, error } = await req;
  const box = $("items");
  if (error) { box.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  box.innerHTML = data.length ? data.map(i => `
    <div class="card" onclick="go('item',${i.id})">
      ${i.photo_url ? `<img src="${esc(i.photo_url)}" alt="">` : ""}
      <h3>${esc(i.title)}</h3>
      ${i.wanted ? `<span class="tag">${t("exchange")}: ${esc(i.wanted)}</span>` : ""}
      ${i.price ? `<span class="tag">${esc(i.price)} FCFA</span>` : ""}
      <div class="muted">${t("by")} ${esc(i.owner_name)}</div>
    </div>`).join("") : `<p class="muted">${t("none")}</p>`;
}

function viewNew() {
  if (!user) { go("login"); return; }
  app.innerHTML = `<div class="card">
    <label>${t("title")}</label><input id="f_title" maxlength="80">
    <label>${t("desc")}</label><textarea id="f_desc" rows="3"></textarea>
    <label>${t("wanted")}</label><input id="f_wanted" maxlength="120">
    <label>${t("price")}</label><input id="f_price" type="number" min="0" inputmode="numeric">
    <label>${t("photo")}</label><input id="f_photo" type="file" accept="image/*">
    <button id="f_go">${t("publish")}</button> <span id="f_err" class="err"></span></div>`;
  $("f_go").onclick = async () => {
    const title = $("f_title").value.trim();
    if (!title) { $("f_err").textContent = t("fill"); return; }
    $("f_go").disabled = true;
    let photo_url = null;
    const file = $("f_photo").files[0];
    if (file) {
      const ext = (file.name.split(".").pop() || "jpg").replace(/[^a-z0-9]/gi, "").slice(0, 5);
      const path = `${user.id}/${Date.now()}.${ext}`;
      const up = await db.storage.from("photos").upload(path, file);
      if (up.error) { $("f_err").textContent = up.error.message; $("f_go").disabled = false; return; }
      photo_url = db.storage.from("photos").getPublicUrl(path).data.publicUrl;
    }
    const { error } = await db.from("items").insert({
      title, description: $("f_desc").value, wanted: $("f_wanted").value,
      price: $("f_price").value || null, photo_url, owner_name: userName()
    });
    if (error) { $("f_err").textContent = error.message; $("f_go").disabled = false; return; }
    go("list");
  };
}

async function viewItem(id) {
  const { data: i, error } = await db.from("items").select("*").eq("id", id).single();
  if (error) { app.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  const { data: rs } = await db.from("ratings").select("stars,comment").eq("rated", i.owner);
  const avg = rs && rs.length ? (rs.reduce((a, r) => a + r.stars, 0) / rs.length).toFixed(1) : null;
  const mine = user && user.id === i.owner;
  app.innerHTML = `<div class="card">
    ${i.photo_url ? `<img src="${esc(i.photo_url)}" alt="">` : ""}
    <h2>${esc(i.title)}</h2>
    <p>${esc(i.description)}</p>
    ${i.wanted ? `<span class="tag">${t("exchange")}: ${esc(i.wanted)}</span>` : ""}
    ${i.price ? `<span class="tag">${t("orMoney")}: ${esc(i.price)} FCFA</span>` : ""}
    <p class="muted">${t("by")} ${esc(i.owner_name)} · ${avg ? "★ " + avg + " (" + rs.length + ")" : t("noRate")}</p>
    ${(rs || []).filter(r => r.comment).map(r => `<div class="msg">★ ${r.stars} — ${esc(r.comment)}</div>`).join("")}
  </div>
  ${mine ? `<p class="muted">${t("mine")}</p><button class="ghost" onclick="delItem(${i.id})">${t("del")}</button>` : `
  <div class="card"><h3>${t("contact")}</h3>
    <textarea id="m_body" rows="3" placeholder="${t("yourMsg")}"></textarea>
    <button id="m_go">${t("send")}</button> <span id="m_err" class="muted"></span></div>
  <div class="card"><h3>${t("rate")}</h3>
    <select id="r_stars">${[5,4,3,2,1].map(n => `<option value="${n}">${"★".repeat(n)}</option>`).join("")}</select>
    <input id="r_comment" placeholder="${t("comment")}" maxlength="200">
    <button id="r_go" class="ghost">${t("rate")}</button> <span id="r_err" class="muted"></span></div>`}`;
  if (!mine) {
    $("m_go").onclick = async () => {
      if (!user) { $("m_err").textContent = t("need"); return; }
      const body = $("m_body").value.trim(); if (!body) return;
      const { error } = await db.from("messages").insert({ item_id: i.id, receiver: i.owner, body, sender_name: userName() });
      $("m_err").textContent = error ? error.message : t("sent");
      if (!error) $("m_body").value = "";
    };
    $("r_go").onclick = async () => {
      if (!user) { $("r_err").textContent = t("need"); return; }
      const { error } = await db.from("ratings").insert({ rated: i.owner, stars: +$("r_stars").value, comment: $("r_comment").value });
      $("r_err").textContent = error ? error.message : t("rated");
    };
  }
}
async function delItem(id) {
  await db.from("items").delete().eq("id", id);
  go("list");
}

async function viewInbox() {
  if (!user) { go("login"); return; }
  const { data, error } = await db.from("messages").select("*").order("created_at", { ascending: false }).limit(100);
  if (error) { app.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
  app.innerHTML = data.length ? data.map(m => {
    const incoming = m.receiver === user.id;
    return `<div class="card">
      <div class="muted">${incoming ? esc(m.sender_name) : "→"} · ${new Date(m.created_at).toLocaleString()}</div>
      <div class="msg">${esc(m.body)}</div>
      ${incoming ? `<textarea id="r${m.id}" rows="2" placeholder="${t("reply")}"></textarea>
        <button class="ghost" onclick="reply(${m.id},${m.item_id},'${m.sender}')">${t("reply")}</button>` : ""}
      <button class="ghost" onclick="go('item',${m.item_id})">${t("all")} →</button>
    </div>`;
  }).join("") : `<p class="muted">${t("noMsg")}</p>`;
}
async function reply(mid, item_id, to) {
  const body = $("r" + mid).value.trim(); if (!body) return;
  const { error } = await db.from("messages").insert({ item_id, receiver: to, body, sender_name: userName() });
  if (!error) go("inbox");
}

function viewLogin() {
  app.innerHTML = `<div class="card">
    <label>${t("name")}</label><input id="a_name">
    <label>${t("email")}</label><input id="a_mail" type="email">
    <label>${t("pass")}</label><input id="a_pass" type="password">
    <button id="a_in">${t("signin")}</button>
    <button id="a_up" class="ghost">${t("signup")}</button>
    <p id="a_err" class="err"></p></div>`;
  $("a_in").onclick = async () => {
    const { error } = await db.auth.signInWithPassword({ email: $("a_mail").value.trim(), password: $("a_pass").value });
    if (error) $("a_err").textContent = error.message; else go("list");
  };
  $("a_up").onclick = async () => {
    const name = $("a_name").value.trim() || $("a_mail").value.split("@")[0];
    const { error } = await db.auth.signUp({ email: $("a_mail").value.trim(), password: $("a_pass").value, options: { data: { name } } });
    $("a_err").textContent = error ? error.message : t("confirmed");
  };
}
async function logout() { await db.auth.signOut(); }

function userName() {
  return (user && user.user_metadata && user.user_metadata.name) || (user && user.email.split("@")[0]) || "?";
}

db.auth.onAuthStateChange((_e, session) => {
  user = session ? session.user : null;
  go(user ? "list" : current.view === "login" ? "login" : current.view, current.arg);
});
db.auth.getSession().then(({ data }) => { user = data.session ? data.session.user : null; go("list"); });
</script>
</body>
</html>
